 "stato": "montare", "link": "https://drive.google.com/file/d/1WDDEr0nzlL647d0kYZhlvtLduYlRIaiI/view"}}]}], "pubblicati": [{"titolo": "9 novembre 1989", "quando": "lun 9/11 · 14:01", "fb": "https://www.facebook.com/1154435890870280/posts/1160551210258748", "ig": "https://www.instagram.com/p/DfhZBx7lBKT/", "x": "https://x.com/Giordano__Ant/status/2119779268372660306"}, {"titolo": "Manovra · giovani e famiglie", "quando": "ven 6/11 · 14:09", "fb": "https://www.facebook.com/reel/1162848366253003", "ig": "https://www.instagram.com/reel/DfZsKx3nKq0/", "x": "https://x.com/Giordano__Ant/status/2118695122455916840"}, {"titolo": "Meloni · Le cose giuste nel momento giusto", "quando": "gio 5/11 · 10:05", "fb": "https://www.facebook.com/reel/1445057227816326", "ig": "https://www.instagram.com/reel/DfWqmNxnaz6/", "x": "https://x.com/Giordano__Ant/status/2118272431366209673"}, {"titolo": "Midterm USA · Cosa cambia per noi", "quando": "mer 4/11 · 17:55", "fb": "https://www.facebook.com/reel/2434864030253104", "ig": "https://www.instagram.com/reel/DfU7moID_1-/", "x": "https://x.com/Giordano__Ant/status/2118024507034083650"}, {"titolo": "Card 4 Novembre · Forze Armate", "quando": "mer 4/11 · 13:24", "fb": "https://www.facebook.com/1154435890870280/posts/1155160294131173", "ig": "https://www.instagram.com/p/DfUcReFDcfa/", "x": "https://x.com/Giordano__Ant/status/2117955550688444774"}, {"titolo": "Guerra cognitiva", "quando": "mer 4/11 · 10:38", "fb": "https://www.facebook.com/reel/1809075533746298/", "ig": "https://www.instagram.com/reel/DfUKutsghDZ/", "x": "https://x.com/Giordano__Ant/status/2117917504861315501"}, {"titolo": "Midterm (prima del voto)", "quando": "mar 3/11 · 18:30", "fb": "https://www.facebook.com/reel/1905529590880201/", "ig": "https://www.instagram.com/reel/DfSduWrgQ7_/", "x": "https://x.com/Giordano__Ant/status/2117678229246927253"}, {"titolo": "Riserve di gas", "quando": "mar 3/11 · 14:00", "fb": "https://www.facebook.com/reel/1151009277470797/", "ig": "https://www.instagram.com/reel/DfR8IrTkWat/", "x": "https://x.com/Giordano__Ant/status/2117606616744804792"}, {"titolo": "Patrimoniale", "quando": "lun 2/11 · 12:56", "fb": "https://www.facebook.com/reel/1839627413895111/", "ig": "https://www.instagram.com/reel/DfPQCNhjGkq/", "x": "https://x.com/Giordano__Ant/status/2117228622868034010"}], "versione": 34, "aggiornato": "2026-11-10T23:08:56.356Z", "ultimo": {"da": "r20", "a": "riserva", "quando": "2026-11-04T15:52:02.094Z"}};
const TESTI = {"1klEdiMiUnjdyJhWDykBXf9HR2sEq2nfJ": "Senta, ma vediamo le conseguenze di quello che è successo oggi. Cambia qualcosa sullo scenario internazionale o per noi? Perché qualcuno prima ci chiedeva, ma adesso Trump cambierà atteggiamento ad esempio sulle guerre, sia sull'Iran che sull'Ucraina? Cioè, che succede concretamente? Perché qui tutti festeggiano. Io ieri leggevo un articolo di Politico, questa rivista online, insomma, diciamo non trampiana comunque, che diceva occhio a festeggiare, occhio a europei, a festeggiare per la vittoria dei democratici perché non è che cambierà granché.\nAnche in questo sono perfettamente d'accordo con lei e con Politico. Cioè, le elezioni americane hanno cambiato il Congresso, non è che cambiano il mondo. Trump resta Presidente fino a gennaio 2029, la politica estera resta nelle sue mani.\nLui stesso ha detto che può essere il Presidente del Veto anche se stamattina è stato molto più, come dire, ragionevole da questo punto di vista. Il tema è anche capire che cosa cambia per l'Italia e che cosa non cambia perché la Russia resta un predatore alle porte dell'Europa. Non è che cambia atteggiamento perché a Washington cambia la maggioranza.\nMosca non se ne frega niente dei risultati elettorali, ammesso e non concesso che non abbia avuto parte in questo. Guarda i rapporti di forza, guarda quanto siamo uniti, guarda quanto sappiamo difenderci. La guerra in Iran non si chiude col voto.\nDifficile per qualsiasi amministrazione che sia repubblicana o che sia democratica. Pesa sull'energia, sui prezzi, sul Mediterraneo e purtroppo per noi il Mediterraneo è casa nostra. E poi un'altra annotazione.\nChi pensa che un congresso democratico porti la pace fa un grosso errore perché se guardiamo la storia sono più le guerre aperte da Presidenti democratici di quelle aperte da Presidenti repubblicani. Quindi credo che i cambiamenti non ci saranno tanto nella sostanza, forse ci sarà qualche cambiamento nei toni.", "1DC28hnMYb3MkSSSIsZvdqfcP23fCIMd-": "Questo lo vedremo, anche se io ho visto già oggi Trump, insomma, che qualche... diciamo, non l'ha presa benissimo, cioè l'ha presa come uno che adesso si arrocca nella trincea, ha postato una foto di un cappellino rosso MAGA con scritto sopra Veto. Cioè, c'è il rischio di una radicalizzazione di Trump da questo punto di vista?\nPiù radicalizzato di quanto non fosse.\nNo, direi di no, è lo stesso Trump, è lo stesso Trump.\nOggi poi è particolarmente seccato, nervoso, credo che già sapesse dove si andava, però ricordiamoci che Trump è comunque un combattente, è quello che gli sparano nell'orecchio e dice fight, fight, fight. Da questo punto di vista, ecco, non mi preoccuperei del fatto che possa diventare più irascibile, che sarà comunque combattivo, sicuramente. Io penso che ci sarà una, come dire, un allentamento nei toni, perché poi qualche compromesso lo deve trovare, non può andare completamente contro il Congresso.", "1X7SISQDF3iCLM8yexoOGo2FyZCFK6EWm": "Qui ci sono tante incognite, ci sono delle letture però interessanti sui giornali italiani venendo al nostro lato. Repubblica oggi dice, parlando invece della questione russo-ucraina, mi fa sorridere perché c'è prima tutta una parte su Trump, in cui giustamente si rivarica la sconfitta, poi dopo c'è questo articolo, anche interessante per carità di Tommaso Ciriaco, che dice, vertici di pace su Kiev, ostilità di Parigi e gelo con Trump, così Meloni resta lontana dal tavolo. Allora io anche qui, facciamo capirci, con tutto quello che uno può pensare sulla guerra, però se Trump è il super cattivo e c'è gelo con Giorgia Meloni, allora ha fatto bene Meloni a prendere distanze, se Trump è un paria, uno tossico e quant'altro, allora va bene che la nostra Presidente del Consiglio metta un po' di spazio, invece no, invece si rimprovera l'assenza di un rapporto.\nCioè qui mi sembra che, Giordano giriamo sempre attorno agli stessi temi, cioè l'isolamento dell'Italia, comunque vada, noi siamo sempre quelli da. const aperti = new Set();
function idDrive(l){const m=String(l||'').match(/\/d\/([^/]+)/);return m?m[1]:String(l||'');}

function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function trova(id){for(const g of stato.giorni)for(const p of g.posti)if(p.id===id)return p;return null;}

function disegna(){
  document.getElementById('titolo').textContent = stato.titolo || 'Piano video';
  if (stato.aggiornato){const d=new Date(stato.aggiornato);document.getElementById('agg').textContent='aggiornato '+d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'numeric'})+' ore '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});}
  const h=[];
  for(const g of stato.giorni){
    h.push('<section class="day"><h2>'+esc(g.titolo)+'</h2>');
    for(const p of g.posti){
      if(g.riserva&&!p.clip)continue;
      h.push('<div class="slot"><div class="time">'+(p.ora?esc(p.ora):'—')+'</div><div class="cell" data-posto="'+p.id+'">');
      const c=p.clip;
      if(!c){h.push('<div class="empty">'+'Libero'+'</div>');}
      else{
        h.push('<div class="card'+(c.bloccata?' locked':'')+'"><div class="grip" title="Trascina per spostare">⠿</div><div class="info"><div class="title">'+esc(c.titolo)+'</div>'+(c.nota?'<div class="note">'+esc(c.nota)+'</div>':'')+'<span class="pill p-'+c.stato+'">'+(ETICHETTE[c.stato]||'')+'</span></div>'+'<div class="acts">'+(TESTI[idDrive(c.link)]?'<button class="tbtn'+(aperti.has(p.id)?' on':'')+'" data-testo="'+p.id+'">Testo</button>':'')+(c.link?'<a class="btn" href="'+esc(c.link)+'" target="_blank" rel="noopener">Guarda</a>':'<span class="soon">Presto</span>')+'</div></div>');
        if(TESTI[idDrive(c.link)])h.push('<div class="testo'+(aperti.has(p.id)?' on':'')+'" id="t-'+p.id+'">'+esc(TESTI[idDrive(c.link)])+'</div>');
      }
      h.push('</div></div>');
    }
    if(g.riserva&&!API.startsWith('__'))h.push('<div class="slot"><div class="time"></div><div class="cell" data-posto="riserva"><div class="empty">+</div></div></div>');
    h.push('</section>');
  }
  document.getElementById('piano').innerHTML=h.join('');
  const L={fb:'Facebook',ig:'Instagram',x:'X'};
  document.getElementById('pub').innerHTML=(stato.pubblicati||[]).map(p=>'<div class="pub"><div class="t">'+esc(p.titolo)+'</div><div class="q">'+esc(p.quando)+'</div><div class="l">'+['fb','ig','x'].filter(k=>p[k]).map(k=>'<a href="'+esc(p[k])+'" target="_blank" rel="noopener">'+L[k]+'</a>').join('')+'</div></div>').join('')||'<div class="pub">Nessuno</div>';
}

function avviso(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(avviso.t);avviso.t=setTimeout(()=>el.classList.remove('on'),2600);}

async function carica(){
  if(API.startsWith('__'))return;
  try{const r=await fetch(API,{cache:'no-store'});const s=await r.json();if(s&&s.giorni){stato=s;if(!trascino)disegna();}}catch(e){}
}

async function scambia(a,b){
  // 04/11/2026 (Luca): non si scambiano, scalano; in riserva si accumulano (op «sposta» nell'Apps Script)
  const pa=trova(a);
  if(!pa||!pa.clip||a===b)return;
  const pb=b==='riserva'?null:trova(b);
  if(pa.clip.bloccata||(pb&&pb.clip&&pb.clip.bloccata)){avviso((pa.clip.evento||(pb&&pb.clip&&pb.clip.evento))?'È una ricorrenza: resta nel suo giorno':'Questa clip è già pubblicata: resta al suo posto');return;}
  const nome=pa.clip.titolo;
  if(API.startsWith('__')){avviso('Non salvato');return;}
  avviso('Sposto…');
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({op:'sposta',da:a,a:b})});
    const s=await r.json();
    if(s.errore){if(s.stato&&s.stato.giorni){stato=s.stato;disegna();}avviso('Non salvato, riprova');return;}
    stato=s;disegna();avviso('Spostato e salvato: '+nome+(b==='riserva'?' in riserva':(pb&&pb.ora?' alle '+pb.ora:'')));
  }catch(e){avviso('Non salvato: controlla la connessione');}
}

// Trascinamento (mouse e dito), solo dai puntini
let trascino=null;
document.addEventListener('pointerdown',e=>{
  if(API.startsWith('__'))return;
  const g=e.target.closest('.grip');if(!g)return;
  const card=g.closest('.card');if(card.classList.contains('locked'))return;
  e.preventDefault();
  const cell=card.closest('.cell');const r=card.getBoundingClientRect();
  const ghost=card.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=r.width+'px';ghost.style.left=r.left+'px';ghost.style.top=r.top+'px';
  document.body.appendChild(ghost);card.classList.add('dragging');
  trascino={da:cell.dataset.posto,ghost,card,dx:e.clientX-r.left,dy:e.clientY-r.top,sopra:null};
  g.setPointerCapture&&g.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{
  if(!trascino)return;
  trascino.ghost.style.left=(e.clientX-trascino.dx)+'px';trascino.ghost.style.top=(e.clientY-trascino.dy)+'px';
  const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest('.cell');
  if(trascino.sopra&&trascino.sopra!==c)trascino.sopra.classList.remove('over');
  if(c&&c.dataset.posto!==trascino.da){c.classList.add('over');trascino.sopra=c;}else trascino.sopra=null;
  if(e.clientY<60)window.scrollBy(0,-12);else if(e.clientY>window.innerHeight-60)window.scrollBy(0,12);
});
function fine(){
  if(!trascino)return;
  const t=trascino;trascino=null;t.ghost.remove();t.card.classList.remove('dragging');
  if(t.sopra){t.sopra.classList.remove('over');scambia(t.da,t.sopra.dataset.posto);}
}
document.addEventListener('pointerup',fine);document.addEventListener('pointercancel',fine);

document.addEventListener('click',e=>{const b=e.target.closest('button.tbtn');if(!b)return;const id=b.dataset.testo;if(aperti.has(id))aperti.delete(id);else aperti.add(id);const el=document.getElementById('t-'+id);if(el)el.classList.toggle('on',aperti.has(id));b.classList.toggle('on',aperti.has(id));});
if(API.startsWith('__'))document.body.classList.add('nodrag');
disegna();carica();setInterval(carica,20000);
</script>
